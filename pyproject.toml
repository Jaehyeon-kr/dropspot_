[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dropspot-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["playwright>=1.50,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
model = ["openai>=2,<3"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pypdf>=6,<7"]

[project.scripts]
dropspot-agent = "agent.cli:main"
dropspot-console = "agent.console:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
